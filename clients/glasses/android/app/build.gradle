plugins {
    id 'com.android.application'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace 'org.cvision.assist'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'org.cvision.assist'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        debug {
            // Standard local Android debug signing; no release signing key is stored here.
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs = [layout.buildDirectory.dir('generated/assistAssets')]
    }
}

def repositoryRoot = rootProject.projectDir.toPath().resolve('../../..').normalize().toFile()
def prepareAssistAssets = tasks.register('prepareAssistAssets', Exec) {
    workingDir repositoryRoot
    commandLine providers.gradleProperty('assistPython').getOrElse('python'),
        new File(repositoryRoot, 'tools/prepare_assist_assets.py').absolutePath
    // Always revalidate pinned binaries and reconstruct the allowlisted bundle.
    outputs.upToDateWhen { false }
}

tasks.named('preBuild').configure { dependsOn prepareAssistAssets }
